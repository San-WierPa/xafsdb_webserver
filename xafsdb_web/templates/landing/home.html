{% load static %}

<html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link rel="stylesheet" type="text/css" href="{% static 'css/base.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&family=Sen:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
    <link rel="shortcut icon" type="image/png" href="{% static 'img/favicon.ico' %}">

    {% block title %}
        <title>RefXAS - Home</title>
    {% endblock %}

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="XAFS Database - Your One-Stop Resource for X-ray Absorption Spectroscopy" />
    <meta property="og:description" content="Explore, analyse, and share datasets for X-ray Absorption Fine Structure (XAFS) with ease." />
    <meta property="og:url" content="http://xafsdb.ddns.net/" />
    <meta property="og:image" content="http://xafsdb.ddns.net/static/img/refxas_thumbnail.JPG" />
    <meta property="og:type" content="website" />

    <style>
      .link-under-button {
        text-align: center;
        margin-top: 10px;
      }
      .small-img {
        position: left;
        margin-right: 20px;
        width: 500px;
        height: auto;
        border: 2px solid #ccc;
        margin-top: 250px;
      }
    </style>

  </head>

<body>

    {% include "landing/navbar.html" %}

    <!-- main -->
    <main class="page">

      <header class="hero">
        <div class="hero-container">
          <div class="hero-text">
            <h1>RefXAS</h1>
            <h4>Research database</h4>
          </div>
        </div>
      </header>

      {% block home_buttons %}
        <div class="button-center">
          <button class="button button4"><a href="{% url 'pg_search' %}">Browse all datasets</a></button>
          <div class="link-under-button">
            <a href="https://san-wierpa.github.io/xafsdb_webserver/" target="_blank">VISIT THE DOCS</a>
          </div>
          <div class="link-under-button">
            <p>Publications:</p>
            <a href="https://doi.org/10.1107/S1600577524006751" target="_blank">RefXAS: an open access database</a><br>
            <a href="https://doi.org/10.52825/cordi.v1i.258" target="_blank">CoRDI: 10.52825 </a><br>
            <a href="https://doi.org/10.5281/zenodo.8412918" target="_blank"><img src="https://zenodo.org/badge/DOI/10.5281/zenodo.8412918.svg" alt="DOI"></a>
          </div>
        </div>

      {% endblock %}

    </main>


    {% include "landing/footer.html" %}
</body>
</html>
