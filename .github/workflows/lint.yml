name: Lint

on: [push, pull_request]

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'  # Matching your local Python version
      - name: Install Black
        run: pip install black
      - name: Run Black
        run: black --check .
